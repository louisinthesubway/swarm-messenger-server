# SWARM Messenger staging: coturn, the TURN relay for ONE-TO-ONE calls. docs/STAGING.md, 5d.
#
# Clients get short-lived credentials from the chat server (GET /v2/calling/relays), which gets
# them from the turn-credentials service (TURN REST API scheme: username "<expiry>:<random>",
# password base64(HMAC-SHA1(static-auth-secret, username))). The secret is NOT in this file:
# docker-compose.yml appends `static-auth-secret=` from turn.env (mode 600, git-ignored, written by
# coturn/make-turn-env.sh) to a copy of this file in the container's tmpfs when it starts.
#
# The container runs in the host's network namespace, so the addresses below are the host's.
# Another host: change the three addresses to its public IPv4 address.

# --------------------------------------------------------------------------- where it listens
# Only the public IPv4 address: not loopback, not the Docker bridges. The host has no IPv6.
listening-ip=64.95.11.180
relay-ip=64.95.11.180
# The address clients are told to send to. The host holds its public address itself (no NAT), so
# this equals relay-ip; it is set so the relay address is explicit rather than detected.
external-ip=64.95.11.180
# 3478 over UDP and TCP: `turn:<host>` (UDP, RFC 7065's default port) and
# `turn:<host>:3478?transport=tcp`, the URLs the chat server hands out (turn.cloudflare in
# staging.yml). No TLS/DTLS listener (turns:, 5349) for now: clients reach 3478, and the media
# inside is end-to-end encrypted (SRTP, keys agreed between the two clients) anyway. RFC 5780
# needs a second address; off.
listening-port=3478
# (coturn 4.18 starts no TLS or DTLS listener without a certificate anyway; no-tls makes it explicit.)
no-tls
no-rfc5780

# Relay ports, UDP only. 100 ports = 100 concurrent allocations. A desktop in a call holds one
# allocation per TURN URL it was given (three) and per local network interface it gathers on, so
# about 3 to 9 per client and twice that per call: enough for 5 to 15 one-to-one calls using the
# relay at the same time, plenty for a staging test group, and a narrow hole in the firewall
# (ufw-calls.sh). total-quota below matches the range.
min-port=49160
max-port=49259

# ------------------------------------------------------------------------ who may use it
use-auth-secret
realm=sfu.chat.swarm.green
fingerprint
# Every public address is a legitimate peer (the other caller, or their relay on this very server:
# two relayed clients reach each other through 64.95.11.180 itself). Nothing else is. Because this
# host's own public address stays allowed, any UDP service listening on it is reachable through
# the relay even where UFW would block it from outside. Today that is Caddy's 443/udp, coturn
# itself, the relay ports and the SFU's 10000/udp, all public anyway: keep it that way.
#
# SECURITY: the relay must never become a way into this host or its private networks. Refused as
# peers: loopback (the chat server's 127.0.0.1:8080/8081/50051, the resolver, other loopback
# services), the Docker networks (swarm-staging 10.77.0.0/24 with every service of this stack,
# docker0 172.17.0.0/16, swarm-pay's 172.18.0.0/16), all other private and shared ranges,
# link-local (including the cloud metadata address 169.254.169.254), multicast, and the reserved
# and documentation ranges.
#
# IPv4 only, on purpose. The relay address is IPv4, and a TURN server relays only to peers of its
# relay address's family, so no IPv6 peer can be reached at all. IPv6 entries can also backfire:
# coturn skips the lower-bound check of a range that starts at the unspecified address and sorts
# every IPv4 address below every IPv6 one, so `::-::1` matched EVERY IPv4 peer (tested 2026-09-29:
# the public peer 64.95.11.180 was refused "in the range: ::-::1"). If this host ever gets IPv6,
# add IPv6 ranges together with an IPv6 relay-ip, none starting at `::`, and test that a public
# IPv4 peer is still allowed.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
no-multicast-peers
# UDP relaying only. WebRTC never asks for TCP allocations (RFC 6062); refusing them means a
# client can never open a TCP connection from this host to anything.
no-tcp-relay

# ------------------------------------------------------------------------ how much
# Concurrent allocations: all of them (= the relay port range), and per username. A username
# belongs to one client for the 12 hours it caches its credentials; 16 leaves room for a redial
# while the previous call's allocations are still being released.
total-quota=100
user-quota=16
# Per allocation, each direction: 375,000 bytes/s = 3 Mbit/s, above a one-to-one HD video call.
max-bps=375000
# All relayed traffic together: 12.5 MB/s = 100 Mbit/s, so relays cannot starve the chat server.
bps-capacity=12500000
stale-nonce=600

# ------------------------------------------------------------------------ housekeeping
# The telnet admin CLI (127.0.0.1:5766) is off by default since coturn 4.x (the old no-cli option
# is deprecated); cli is not set, so it stays off.
no-software-attribute
log-file=stdout
simple-log
# Inside the container's tmpfs (docker-compose.yml), not a volume: nothing here is worth keeping.
pidfile=/var/lib/coturn/turnserver.pid
userdb=/var/lib/coturn/turndb

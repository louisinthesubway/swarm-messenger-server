# SWARM Messenger — staging stack (self-hosted, single Linux host)
#
# Every cloud dependency of upstream Signal-Server is replaced with a local equivalent:
#
#   FoundationDB   messages, groups  foundationdb/foundationdb (single, ssd); groups + sync in the storage service's own directory
#   DynamoDB       accounts/keys/... amazon/dynamodb-local
#   Redis clusters cache/rate/...    redis:7.4-alpine, one single-node cluster per role (redis/single-node-cluster.sh)
#   Redis          pubsub            redis (standalone)
#   S3             CDN + paged PQ    minio
#   CDN3 uploads   attachments       ./tus (TUS 1.0.0 into the MinIO CDN bucket)
#   Storage svc    groups + sync     ./storage (swarm-storage-service, a fork of signalapp/storage-service)
#   Bigtable       migration source  ./bigtable (emulator; its tables are copied into FoundationDB once, then it goes)
#   Registration   SMS verification  ./registration-stub (fixed code, staging only)
#   Cloudflare TURN  1:1 call relay  coturn (host network) + ./turn-credentials (Cloudflare's API shape)
#   Calling svc    group calls (SFU) ./sfu: calling-backend (media, 10000) + calling-frontend
#                                    (swarm-calling-service, a fork of signalapp/Signal-Calling-Service;
#                                    call records in the dynamodb service, table from calling-bootstrap)
#   TLS            public edge       caddy (profile: edge)
#
# Container images are pinned to the same tags/digests the upstream test suite uses
# (see pom.xml: dynamodb.image, redis.image, redis-cluster.image, foundationdb.version).
#
# Nothing here talks to Signal's servers, to AWS, to GCP, or to any push service.
#
# Start order and health checks: docs/STAGING.md
# What is disabled and why:      docs/STAGING.md ("Disabled features")
# Deviations from upstream code: docs/SWARM-CHANGES.md

name: swarm-messenger-staging

x-restart: &restart
  restart: unless-stopped

networks:
  swarm:
    name: swarm-staging
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  fdb-data:
  fdb-etc:
  dynamodb-data:
  minio-data:
  tus-data:
  bigtable-data:
  caddy-data:
  caddy-config:
  redis-cache-data:
  redis-pushscheduler-data:
  redis-ratelimiters-data:
  redis-messages-data:

services:

  # ---------------------------------------------------------------- FoundationDB
  # Message store. Single-process, ssd redundancy: correct for staging, NOT for production
  # (production wants at least "double" redundancy across three machines).
  foundationdb:
    <<: *restart
    image: foundationdb/foundationdb:7.3.76
    hostname: foundationdb
    environment:
      FDB_NETWORKING_MODE: container
      FDB_CLUSTER_FILE: /var/fdb/etc/fdb.cluster
      FDB_COORDINATOR_PORT: "4500"
    volumes:
      - fdb-data:/var/fdb/data
      - fdb-etc:/var/fdb/etc
    networks:
      swarm:
        ipv4_address: 10.77.0.11
    healthcheck:
      # "fdbcli --exec status" exits non-zero while the database is unavailable.
      test: ["CMD-SHELL", "fdbcli --exec 'status minimal' | grep -q 'The database is available'"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # One-shot: creates the database the first time the volume is empty. Idempotent —
  # "configure new" fails harmlessly once a database exists.
  foundationdb-init:
    image: foundationdb/foundationdb:7.3.76
    restart: "no"
    depends_on:
      foundationdb:
        condition: service_started
    environment:
      FDB_CLUSTER_FILE: /var/fdb/etc/fdb.cluster
    volumes:
      - fdb-etc:/var/fdb/etc
      - ./foundationdb/init-foundationdb.sh:/init-foundationdb.sh:ro
    entrypoint: ["/bin/bash", "/init-foundationdb.sh"]
    networks:
      - swarm

  # ---------------------------------------------------------------- DynamoDB Local
  dynamodb:
    <<: *restart
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    hostname: dynamodb
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-disableTelemetry", "-dbPath", "/data"]
    volumes:
      - dynamodb-data:/data
    networks:
      - swarm
    # No healthcheck: it would have to assume which shell utilities the image ships. Readiness
    # is waited for by dynamodb-bootstrap, which runs in an image that certainly has the AWS
    # CLI, and `chat` waits for that one-shot to finish.

  # One-shot: creates every table named in staging.yml. Waits for DynamoDB. Idempotent.
  dynamodb-bootstrap:
    image: amazon/aws-cli:2.31.11
    restart: "no"
    depends_on:
      dynamodb:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${SWARM_AWS_ACCESS_KEY_ID:-swarmstaging}
      AWS_SECRET_ACCESS_KEY: ${SWARM_AWS_SECRET_ACCESS_KEY:-swarmstaging}
      AWS_DEFAULT_REGION: ${SWARM_AWS_REGION:-us-east-1}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      SWARM_TABLE_PREFIX: ${SWARM_TABLE_PREFIX:-swarm_}
    volumes:
      - ./dynamodb/bootstrap-tables.sh:/bootstrap-tables.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap-tables.sh"]
    networks:
      - swarm

  # ---------------------------------------------------------------- Redis
  # Four Redis *clusters*, one per role, because FaultTolerantRedisClusterClient speaks
  # the cluster protocol (CLUSTER SLOTS / MOVED) and will not talk to a standalone server.
  # Each is a single-node cluster owning all 16384 slots — the smallest thing that is still
  # a real cluster. Static IPs are used because a Redis cluster announces the address it
  # believes it has, and the chat server connects to whatever it announces.
  # ---------------------------------------------------------------- Redis "clusters"
  # The chat server uses Lettuce's CLUSTER client for these four, so each must be a Redis
  # Cluster. 2026-09-27: the Bitnami cluster creator refuses fewer than three masters
  # ("Redis Cluster requires at least 3 master nodes"), so each is now ONE stock Redis node in
  # cluster mode that assigns all 16384 slots to itself (redis/single-node-cluster.sh). Fixed
  # addresses because a cluster node announces its IP to clients. Only the messages cache
  # persists to its volume; the others are pure caches.
  redis-cache:
    <<: *restart
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    hostname: redis-cache
    environment:
      REDIS_ANNOUNCE_IP: "10.77.0.21"
      REDIS_PERSIST: "no"
    volumes:
      - redis-cache-data:/data
      - ./redis/single-node-cluster.sh:/single-node-cluster.sh:ro
    entrypoint: ["/bin/sh", "/single-node-cluster.sh"]
    networks:
      swarm:
        ipv4_address: 10.77.0.21
    healthcheck: &redis-cluster-health
      test: ["CMD-SHELL", "redis-cli cluster info | grep -q 'cluster_state:ok'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  redis-pushscheduler:
    <<: *restart
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    hostname: redis-pushscheduler
    environment:
      REDIS_ANNOUNCE_IP: "10.77.0.22"
      REDIS_PERSIST: "no"
    volumes:
      - redis-pushscheduler-data:/data
      - ./redis/single-node-cluster.sh:/single-node-cluster.sh:ro
    entrypoint: ["/bin/sh", "/single-node-cluster.sh"]
    networks:
      swarm:
        ipv4_address: 10.77.0.22
    healthcheck: *redis-cluster-health

  redis-ratelimiters:
    <<: *restart
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    hostname: redis-ratelimiters
    environment:
      REDIS_ANNOUNCE_IP: "10.77.0.23"
      REDIS_PERSIST: "no"
    volumes:
      - redis-ratelimiters-data:/data
      - ./redis/single-node-cluster.sh:/single-node-cluster.sh:ro
    entrypoint: ["/bin/sh", "/single-node-cluster.sh"]
    networks:
      swarm:
        ipv4_address: 10.77.0.23
    healthcheck: *redis-cluster-health

  redis-messages:
    <<: *restart
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    hostname: redis-messages
    environment:
      REDIS_ANNOUNCE_IP: "10.77.0.24"
      REDIS_PERSIST: "yes"
    volumes:
      - redis-messages-data:/data
      - ./redis/single-node-cluster.sh:/single-node-cluster.sh:ro
    entrypoint: ["/bin/sh", "/single-node-cluster.sh"]
    networks:
      swarm:
        ipv4_address: 10.77.0.24
    healthcheck: *redis-cluster-health

  redis-pubsub:
    <<: *restart
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    hostname: redis-pubsub
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      swarm:
        ipv4_address: 10.77.0.25
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- MinIO (S3)
  # MINIO_DOMAIN makes MinIO accept virtual-host-style addressing, which is what the AWS
  # SDK v2 uses by default. The network aliases below make <bucket>.minio.swarm.local
  # resolve to this container, so no code change is needed to force path-style addressing.
  minio:
    <<: *restart
    # 2026-09-27: MinIO's own images (minio/minio, minio/mc) are gone from Docker Hub and
    # Quay at every tag. The frozen Bitnami legacy image still pulls and ships both the
    # server and the `mc` client (MinIO DEVELOPMENT.2025-05-24, mc 2025-05-21), so it serves
    # both this service and minio-bootstrap. It runs as uid 1001 with its data directory at
    # /bitnami/minio/data and its own entrypoint, which honours MINIO_ROOT_USER/PASSWORD and
    # listens on 9000 (API) and 9001 (console).
    image: docker.io/bitnamilegacy/minio:latest@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    hostname: minio
    environment:
      MINIO_ROOT_USER: ${SWARM_MINIO_ROOT_USER:-swarmstaging}
      MINIO_ROOT_PASSWORD: ${SWARM_MINIO_ROOT_PASSWORD:?set SWARM_MINIO_ROOT_PASSWORD in .env}
      MINIO_DOMAIN: minio.swarm.local
    volumes:
      - minio-data:/bitnami/minio/data
    networks:
      swarm:
        aliases:
          - minio.swarm.local
          - swarm-cdn.minio.swarm.local
          - swarm-prekeys.minio.swarm.local
          - swarm-config.minio.swarm.local
    # No healthcheck, for the same reason as dynamodb: minio-bootstrap runs in the `mc` image
    # and waits for readiness there, and `chat` waits for that one-shot to finish.

  minio-bootstrap:
    # Same image as `minio`: it carries `mc` on PATH (see the note there).
    image: docker.io/bitnamilegacy/minio:latest@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${SWARM_MINIO_ROOT_USER:-swarmstaging}
      MINIO_ROOT_PASSWORD: ${SWARM_MINIO_ROOT_PASSWORD:?set SWARM_MINIO_ROOT_PASSWORD in .env}
      SWARM_CDN_ACCESS_KEY: ${SWARM_CDN_ACCESS_KEY:-swarmcdn}
      SWARM_CDN_SECRET_KEY: ${SWARM_CDN_SECRET_KEY:?set SWARM_CDN_SECRET_KEY in .env}
      SWARM_AWS_ACCESS_KEY_ID: ${SWARM_AWS_ACCESS_KEY_ID:?set SWARM_AWS_ACCESS_KEY_ID in .env}
      SWARM_AWS_SECRET_ACCESS_KEY: ${SWARM_AWS_SECRET_ACCESS_KEY:?set SWARM_AWS_SECRET_ACCESS_KEY in .env}
    # The CDN3 upload service's MinIO user (SWARM_TUS_S3_*), written by tus/make-tus-env.sh.
    # Optional so that a host without it still bootstraps; the script then warns and skips it.
    env_file:
      - path: tus.env
        required: false
    volumes:
      - ./minio/bootstrap-buckets.sh:/bootstrap-buckets.sh:ro
      - ./minio/dynamic-config.yaml:/in/dynamic-config.yaml:ro
      - ./minio/asn.tsv:/in/asn.tsv:ro
    entrypoint: ["/bin/sh", "/bootstrap-buckets.sh"]
    networks:
      - swarm

  # ---------------------------------------------------------------- Bigtable emulator
  # The storage service (below) kept groups, group change logs, and the settings/contacts sync
  # records here until its switch to FoundationDB (storage.yml, storage.backend):
  # fullstorydev/emulators' cbtemulator (a fork of Google's bttest emulator) built from pinned
  # source in bigtable/Dockerfile, with its tables in LevelDB on the `bigtable-data` volume. The
  # emulator and its one-shot now stay only as the source of the one-off
  # migrate-bigtable-to-foundationdb command; remove both, and the bigtable block of storage.yml,
  # once the migration is verified (docs/STAGING.md, 5c). Not published on the host.
  bigtable:
    <<: *restart
    build:
      context: ./bigtable
    image: swarm-messenger/bigtable:staging
    hostname: bigtable
    volumes:
      - bigtable-data:/data
    networks:
      - swarm
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8086"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # One-shot: creates the storage service's four tables and their column families with `cbt`
  # (same image). Idempotent; tables that exist on the volume are left alone.
  bigtable-bootstrap:
    build:
      context: ./bigtable
    image: swarm-messenger/bigtable:staging
    restart: "no"
    depends_on:
      bigtable:
        condition: service_healthy
    environment:
      BIGTABLE_EMULATOR_HOST: bigtable:8086
    volumes:
      - ./bigtable/bootstrap-tables.sh:/bootstrap-tables.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-tables.sh"]
    networks:
      - swarm

  # ---------------------------------------------------------------- CDN3 attachment uploads
  # TUS 1.0.0 (creation-with-upload, HEAD, PATCH) for message attachments. Caddy sends
  # https://cdn.<domain>/upload/attachments here; the service checks the chat server's upload
  # token on every request and writes finished uploads into the CDN bucket as attachments/<key>.
  # Reads go from Caddy straight to MinIO. Contract and runbook: docs/STAGING.md, section 8a.
  tus:
    <<: *restart
    build:
      context: ./tus
    image: swarm-messenger/tus:staging
    hostname: tus
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    # SWARM_TUS_TOKEN_SECRET and the service's own MinIO key. Not .env: the chat container reads
    # all of .env, and its environment should not change for this.
    env_file:
      - path: tus.env
        required: false
    environment:
      TUS_PUBLIC_UPLOAD_URI: https://${SWARM_CDN_DOMAIN:-cdn.chat.swarm.green}/upload
      TUS_S3_ENDPOINT: http://minio:9000
      TUS_S3_BUCKET: ${SWARM_CDN_BUCKET:-swarm-cdn}
      TUS_S3_REGION: ${SWARM_AWS_REGION:-us-east-1}
      # attachments.maxAttachmentUploadSizeInBytes in staging.yml
      TUS_MAX_UPLOAD_BYTES: "104857600"
    volumes:
      - tus-data:/data
    networks:
      - swarm
    healthcheck:
      # 200 once the service's MinIO key can read under attachments/ (probed every minute).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  # ---------------------------------------------------------------- registration stub
  # Issues and accepts one fixed verification code. Refuses to start unless
  # SWARM_STAGING_FIXED_CODE=true. Never deploy this on a public registration endpoint.
  registration-stub:
    <<: *restart
    build:
      context: ./registration-stub
      args:
        REGISTRATION_PROTO: RegistrationService.proto
    image: swarm-messenger/registration-stub:staging
    hostname: registration-stub
    environment:
      SWARM_STAGING_FIXED_CODE: ${SWARM_STAGING_FIXED_CODE:?must be exactly "true" to run the staging stack}
      SWARM_STAGING_VERIFICATION_CODE: ${SWARM_STAGING_VERIFICATION_CODE:-123456}
      SWARM_STUB_LISTEN: "0.0.0.0:8443"
      SWARM_STUB_TLS_CERT: /certs/registration-stub.crt
      SWARM_STUB_TLS_KEY: /certs/registration-stub.key
    volumes:
      - ./certs:/certs:ro
    networks:
      - swarm
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- chat server
  chat:
    <<: *restart
    build:
      # Context is this directory; the image copies only build/chat.jar and build/libfdb_c.so,
      # which prepare-image.sh stages. Run ./prepare-image.sh before `docker compose build`.
      context: .
      dockerfile: Dockerfile
    image: swarm-messenger/chat:staging
    hostname: chat
    depends_on:
      foundationdb:
        condition: service_healthy
      foundationdb-init:
        condition: service_completed_successfully
      dynamodb-bootstrap:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-pushscheduler:
        condition: service_healthy
      redis-ratelimiters:
        condition: service_healthy
      redis-messages:
        condition: service_healthy
      redis-pubsub:
        condition: service_healthy
      registration-stub:
        condition: service_started
    # staging.yml resolves ${SWARM_*} INSIDE the container (Dropwizard substitution), so the
    # whole .env must reach the process, not only the compose file. 2026-09-27: without this
    # the server died on 'Cannot resolve variable SWARM_REGISTRATION_CA_PEM'.
    env_file:
      - .env
    environment:
      # The staging registration channel carries no identity token; the server refuses to
      # start with `registrationService.type: swarm-staging` unless this is exactly "true".
      SWARM_STAGING_FIXED_CODE: ${SWARM_STAGING_FIXED_CODE:?must be exactly "true" to run the staging stack}
      SECRETS_BUNDLE: /config/staging-secrets.yml
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.bin
        -Djava.awt.headless=true
        -Dlog4j2.formatMsgNoLookups=true
    volumes:
      - ./staging.yml:/config/staging.yml:ro
      - ./staging-secrets.yml:/config/staging-secrets.yml:ro
      - fdb-etc:/etc/foundationdb:ro
    ports:
      # Bound to loopback only. Public traffic arrives through caddy.
      - "127.0.0.1:8080:8080"   # HTTP/2 cleartext REST + websocket
      - "127.0.0.1:8081:8081"   # Dropwizard admin (health, metrics)
      - "127.0.0.1:50051:50051" # gRPC "omnibus" listener
    networks:
      - swarm
    healthcheck:
      # bash, not sh: /dev/tcp is a bash feature and CMD-SHELL runs /bin/sh (dash) in this image,
      # so the check failed with 'cannot create /dev/tcp/...: Directory nonexistent' (2026-09-27).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /healthcheck HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ---------------------------------------------------------------- storage service
  # Groups (/v2/groups*) and settings/contacts sync (/v1/storage*): swarm-storage-service
  # (github.com/louisinthesubway/swarm-storage-service), a fork of signalapp/storage-service.
  # Caddy routes those two path families on the chat site here; the chat server itself only
  # calls DELETE /v1/storage when an account is deleted (storageService.uri in staging.yml).
  # Plain HTTP on the compose network, not published on the host. The image is built from a
  # checkout of the fork: see storage/Dockerfile. The three secrets come from storage.env
  # (storage/make-storage-env.sh); the CDN key for group avatars from .env. docs/STAGING.md, 5c.
  # Its data lives in the `foundationdb` service (the chat server's cluster, in the storage
  # service's own directory): the cluster file comes read-only from fdb-etc, as for chat.
  storage:
    <<: *restart
    build:
      context: ./storage
    image: swarm-messenger/storage-service:staging
    hostname: storage
    depends_on:
      foundationdb:
        condition: service_healthy
      foundationdb-init:
        condition: service_completed_successfully
      # Only for the migration command's source; goes with the emulator (see `bigtable` above).
      bigtable-bootstrap:
        condition: service_completed_successfully
    # Optional so that other compose commands (the nightly backup's `stop chat`) never fail on a
    # host that lacks it; without it the service itself refuses to start (unresolved ${...}).
    env_file:
      - path: storage.env
        required: false
    environment:
      # Read only by migrate-bigtable-to-foundationdb (the service itself uses FoundationDB).
      BIGTABLE_EMULATOR_HOST: bigtable:8086
      SWARM_CDN_ACCESS_KEY: ${SWARM_CDN_ACCESS_KEY:-swarmcdn}
      SWARM_CDN_SECRET_KEY: ${SWARM_CDN_SECRET_KEY:-}
      SWARM_CDN_BUCKET: ${SWARM_CDN_BUCKET:-swarm-cdn}
      SWARM_AWS_REGION: ${SWARM_AWS_REGION:-us-east-1}
      # jib's -Xmx8192m is sized for Signal's production; staging needs far less.
      JAVA_TOOL_OPTIONS: >-
        -Xmx1g
        -XX:HeapDumpPath=/tmp/heapdump.bin
    volumes:
      - ./storage.yml:/config/storage.yml:ro
      - fdb-etc:/etc/foundationdb:ro
    networks:
      - swarm
    healthcheck:
      # /_ready reads one key-value from each of the service's four FoundationDB subdirectories on
      # its first calls (upstream's warm-up, one row per table), so "healthy" means the service is
      # up AND reaches its data.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /_ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------- calls: TURN relay (1:1)
  # coturn relays the media of a one-to-one call when the two clients cannot reach each other
  # directly, and always when a client hides its IP address (the desktop does that for calls with
  # someone who is not a contact yet, and for everyone with "Always relay calls"). HOST network:
  # the relay ports are real host ports, without a docker-proxy per port or NAT in between. It
  # listens on 64.95.11.180:3478 UDP+TCP, relays on 49160-49259/udp, has no TLS listener, and
  # refuses to relay to loopback, private, link-local or Docker addresses (coturn/turnserver.conf).
  # UFW must allow those ports: ufw-calls.sh. The static-auth-secret comes from turn.env
  # (coturn/make-turn-env.sh) and is appended to a copy of the config in the container's tmpfs,
  # so it is never on a command line. docs/STAGING.md, section 5d.
  coturn:
    <<: *restart
    image: coturn/coturn:4.18.0-trixie@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    network_mode: host
    env_file:
      - path: turn.env
        required: false
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    tmpfs:
      # Owned by the image's user (nobody:nogroup), readable by nobody else: the config copy with
      # the secret is written here.
      - /var/lib/coturn:uid=65534,gid=65534,mode=700
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${SWARM_TURN_STATIC_AUTH_SECRET:?is not set: run ./coturn/make-turn-env.sh (docs/STAGING.md, 5d)}"
        umask 077
        { cat /etc/coturn/turnserver.conf; printf 'static-auth-secret=%s\n' "$$SWARM_TURN_STATIC_AUTH_SECRET"; } > /var/lib/coturn/turnserver.conf
        exec turnserver -c /var/lib/coturn/turnserver.conf
    healthcheck:
      # A STUN binding request to the address coturn listens on (unauthenticated, like a client's).
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 \"$$(sed -n 's/^listening-ip=//p' /etc/coturn/turnserver.conf)\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------- calls: TURN credentials
  # The chat server's TURN code knows only Cloudflare's credential API (POST {"ttl": n} with a
  # Bearer token, 201 {"iceServers": {"username", "credential"}}), but its endpoint is
  # configurable (turn.cloudflare.endpoint in staging.yml). This service answers in exactly that
  # shape with coturn TURN REST credentials: username "<expiry>:<random>", credential
  # base64(HMAC-SHA1(static-auth-secret, username)); any other token gets 401. Compose network
  # only, not published. turn-credentials/server.mjs, docs/STAGING.md, section 5d.
  turn-credentials:
    <<: *restart
    build:
      context: ./turn-credentials
    image: swarm-messenger/turn-credentials:staging
    hostname: turn-credentials
    env_file:
      - path: turn.env
        required: false
    environment:
      # Informational: the chat server hands clients its own turn.cloudflare URLs.
      SWARM_TURN_URLS: turn:${SWARM_SFU_DOMAIN:-sfu.chat.swarm.green}:3478,turn:${SWARM_SFU_DOMAIN:-sfu.chat.swarm.green}:3478?transport=tcp
    networks:
      - swarm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------- calls: group calls (SFU)
  # Signal's calling service, built from louisinthesubway/swarm-calling-service at a pinned commit
  # (sfu/Dockerfile). Clients reach the frontend at https://sfu.chat.swarm.green (Caddy); it checks
  # the group-call token the storage service signed (/v2/groups/token), keeps a call record in
  # DynamoDB and puts the call on the backend, whose media port 10000 (UDP, and TCP for networks
  # that block UDP) the clients then talk to directly. docs/STAGING.md, section 5d.

  # One-shot: the frontend's table (swarm_calling_rooms) in the stack's DynamoDB Local. Idempotent.
  calling-bootstrap:
    image: amazon/aws-cli:2.31.11
    restart: "no"
    depends_on:
      dynamodb:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${SWARM_AWS_ACCESS_KEY_ID:-swarmstaging}
      AWS_SECRET_ACCESS_KEY: ${SWARM_AWS_SECRET_ACCESS_KEY:-swarmstaging}
      AWS_DEFAULT_REGION: ${SWARM_AWS_REGION:-us-east-1}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      CALLING_TABLE: swarm_calling_rooms
    volumes:
      - ./sfu/bootstrap-calling-table.sh:/bootstrap-calling-table.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap-calling-table.sh"]
    networks:
      - swarm

  # The media server. Clients send ICE/SRTP to 64.95.11.180:10000; the frontend reaches its
  # signaling API at http://10.77.0.31:8080. A fixed address, because the frontend asks the backend
  # for its own address (/v1/info = --signaling-ip) and stores it in each call record.
  calling-backend:
    <<: *restart
    build:
      context: ./sfu
      target: backend
    image: swarm-messenger/calling-backend:staging
    hostname: calling-backend
    command:
      - --binding-ip=0.0.0.0
      - --ice-candidate-ip=64.95.11.180
      - --ice-candidate-port=10000
      - --ice-candidate-port-tcp=10000
      - --signaling-ip=10.77.0.31
      - --signaling-port=8080
      - --max-clients-per-call=16
      - --diagnostics-interval-secs=30
      - --approved-users-persistence-url=http://calling-frontend:8100/v1/call-link-approvals
      - --remove-call-records-base-url=http://calling-frontend:8100/v2/conference
    ports:
      - "10000:10000/udp"
      - "10000:10000/tcp"
    networks:
      swarm:
        ipv4_address: 10.77.0.31
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  # The HTTP API the clients call (PUT/GET /v2/conference/participants, /v1/call-link). Its two
  # secrets come from sfu.env (sfu/make-sfu-env.sh) through the environment, not the command line.
  calling-frontend:
    <<: *restart
    build:
      context: ./sfu
      target: frontend
    image: swarm-messenger/calling-frontend:staging
    hostname: calling-frontend
    depends_on:
      calling-bootstrap:
        condition: service_completed_successfully
      calling-backend:
        condition: service_healthy
    env_file:
      - path: sfu.env
        required: false
    command:
      - --region=swarm-staging
      - --version=141
      - --max-clients-per-call=16
      - --cleanup-interval-ms=30000
      - --regional-url-template=https://${SWARM_SFU_DOMAIN:-sfu.chat.swarm.green}
      - --calling-server-url=http://calling-backend:8080
      - --storage-table=swarm_calling_rooms
      - --storage-region=${SWARM_AWS_REGION:-us-east-1}
      # Upstream's "testing" switch for a local DynamoDB: fixed dummy keys, this endpoint.
      - --storage-endpoint=http://dynamodb:8000
      - --internal-api-port=8100
    networks:
      - swarm
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  # ---------------------------------------------------------------- TLS edge
  # Optional: `docker compose --profile edge up -d`. Terminates TLS for
  # chat.swarm.green / cdn.chat.swarm.green / reg.chat.swarm.green.
  caddy:
    <<: *restart
    profiles: ["edge"]
    image: caddy:2.10-alpine
    hostname: caddy
    depends_on:
      chat:
        condition: service_started
    environment:
      SWARM_CHAT_DOMAIN: ${SWARM_CHAT_DOMAIN:-chat.swarm.green}
      SWARM_CDN_DOMAIN: ${SWARM_CDN_DOMAIN:-cdn.chat.swarm.green}
      SWARM_ACME_EMAIL: ${SWARM_ACME_EMAIL:?set SWARM_ACME_EMAIL in .env}
      # Go's HTTP/2 server advertises RFC 8441 extended CONNECT only with this set. libsignal's
      # HTTP/2 chat connection opens its websocket that way; without it such a client cannot
      # connect at all. See docs/STAGING.md, section 5b.
      GODEBUG: http2xconnect=1
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - swarm

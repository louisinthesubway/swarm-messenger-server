# SWARM Messenger — staging configuration for the self-hosted stack in this directory.
#
# Read docs/STAGING.md before changing anything here.
#
# HOW THIS FILE WAS DERIVED
# -----------------------------------------------------------------------------------------
# It starts from upstream's own `service/src/test/resources/config/test.yml`, which is the
# configuration upstream uses to boot a real, feature-limited server
# (`./mvnw integration-test -Ptest-server`). Every block for a feature SWARM does not run —
# billing, push, SVR, CDSI, key transparency — keeps upstream's placeholder values verbatim,
# because upstream demonstrably starts a server with them.
#
# Only the blocks that must point at something real were changed:
#
#   dynamoDbClient                 -> DynamoDB Local (endpointOverride; see docs/SWARM-CHANGES.md)
#   dynamoDbTables                 -> swarm_* table names created by dynamodb/bootstrap-tables.sh
#   cacheCluster / pushScheduler /
#     rateLimiters / messageCache  -> the four single-node Redis clusters in docker-compose.yml
#   pubsub                         -> the standalone Redis in docker-compose.yml
#   foundationDbMessages.clusters  -> the cluster file written by the foundationdb container
#   cdn / pagedSingleUseKEMPreKey  -> MinIO
#   dynamicConfig / asnTable       -> objects in MinIO (uploaded by minio/bootstrap-buckets.sh)
#   registrationService            -> the fixed-code stub in registration-stub/
#   server / grpc / externalRequestFilter -> listen addresses for a container
#
# Environment variables are substituted before the YAML is parsed (Dropwizard
# SubstitutingSourceProvider, strict mode), so `${VAR:-default}` works and a `${VAR}` with no
# default makes the server refuse to start. Secrets are NOT in this file; they are resolved
# through `secret://` from the bundle named by -Dsecrets.bundle.filename.

logging:
  level: ${SWARM_LOG_LEVEL:-INFO}
  loggers:
    org.whispersystems.textsecuregcm: ${SWARM_LOG_LEVEL:-INFO}
  appenders:
    - type: console
      threshold: ALL
      timeZone: UTC
      target: stdout

health:
  # Staging restarts often; do not hold the port open draining connections.
  delayedShutdownHandlerEnabled: false

server:
  allowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - HEAD
    - OPTIONS
    - PATCH
    - CONNECT
  applicationConnectors:
    # Cleartext HTTP/2 (h2c). TLS is terminated by Caddy at the edge; see caddy/Caddyfile.
    # If you would rather have the server terminate TLS itself, replace this with a
    # `type: h2` connector plus keyStorePath/keyStorePassword and set tlsKeyStore below.
    - type: h2c
      port: 8080
      useForwardedHeaders: true
  adminConnectors:
    - type: http
      port: 8081
      bindHost: 0.0.0.0

grpc:
  bindAddress: 0.0.0.0
  port: 50051
  websocketAddress: localhost
  websocketPort: 8080
  h2c: true

# Only a path-less keystore: nothing in this stack terminates TLS inside the JVM.
tlsKeyStore:
  password: secret://tlsKeyStore.password

externalRequestFilter:
  grpcMethods: []
  paths: []
  permittedInternalRanges:
    - 127.0.0.0/8
    # The compose network, so the admin/metrics paths stay reachable from sibling containers.
    - 10.77.0.0/24

# ---------------------------------------------------------------------------- storage

awsCredentialsProvider:
  type: static
  accessKeyId: secret://aws.accessKeyId
  secretAccessKey: secret://aws.secretAccessKey

dynamoDbClient:
  # SWARM: endpointOverride is a SWARM addition to DynamoDbClientConfiguration. See
  # docs/SWARM-CHANGES.md. With it unset the behaviour is exactly upstream's.
  region: ${SWARM_AWS_REGION:-us-east-1}
  endpointOverride: ${SWARM_DYNAMODB_ENDPOINT:-http://dynamodb:8000}
  clientExecutionTimeout: PT30S
  clientRequestTimeout: PT10S
  maxConnections: 50

dynamoDbTables:
  accounts:
    tableName: swarm_accounts
    phoneNumberTableName: swarm_numbers
    phoneNumberIdentifierTableName: swarm_pni_assignment
    usernamesTableName: swarm_usernames
    usedLinkDeviceTokensTableName: swarm_used_link_device_tokens
  appleDeviceChecks:
    tableName: swarm_apple_device_check
  appleDeviceCheckPublicKeys:
    tableName: swarm_apple_device_check_key_constraint
  backups:
    tableName: swarm_backups
  changeNumberWaitingPeriods:
    tableName: swarm_change_number_waiting_periods
  clientReleases:
    tableName: swarm_client_releases
  deletedAccounts:
    tableName: swarm_deleted_accounts
  deletedAccountsLock:
    tableName: swarm_deleted_accounts_lock
  donationPermits:
    tableName: swarm_donation_permits
    expiration: P7D
  issuedReceipts:
    tableName: swarm_issued_receipts
    generator: ${SWARM_ISSUED_RECEIPTS_GENERATOR:-abcdefg12345678=}
    maxReceiptsPerSubscriptionPayment:
      STRIPE: 1
      BRAINTREE: 1
      GOOGLE_PLAY_BILLING: 1
      APPLE_APP_STORE: 1
  ecKeys:
    tableName: swarm_keys
  ecSignedPreKeys:
    tableName: swarm_repeated_use_signed_ec_pre_keys
  pagedPqKeys:
    tableName: swarm_paged_pq_keys
  pqLastResortKeys:
    tableName: swarm_repeated_use_signed_kem_pre_keys
  messages:
    tableName: swarm_messages
    expiration: P30D
  onetimeDonations:
    tableName: swarm_onetime_donations
    expiration: P90D
  phoneNumberIdentifiers:
    tableName: swarm_pni
  profileAvatars:
    tableName: swarm_profile_avatars
  profiles:
    tableName: swarm_profiles
  profilesV2:
    tableName: swarm_profiles_v2
  pushChallenge:
    tableName: swarm_push_challenge
  pushNotificationExperimentSamples:
    tableName: swarm_push_notification_experiment_samples
  redeemedReceipts:
    tableName: swarm_redeemed_receipts
  registrationRecovery:
    tableName: swarm_registration_recovery_passwords
    expiration: P300D
  remoteConfig:
    tableName: swarm_remote_config
  reportMessage:
    tableName: swarm_report_messages
  scheduledJobs:
    tableName: swarm_scheduled_jobs
    expiration: P7D
  subscriptions:
    tableName: swarm_subscriptions
  verificationSessions:
    tableName: swarm_verification_sessions

# Message store. One single-process FoundationDB cluster. The cluster file is written by the
# foundationdb container into a shared volume mounted read-only at /etc/foundationdb.
foundationDbMessages:
  maxWatchesPerClient: 10000
  transactionTimeout: PT1S
  transactionRetryLimit: 3
  batchPriorityTransactionTimeout: PT5S
  batchPriorityTransactionRetryLimit: 10
  versionstampCipherKeys:
    0: secret://foundationDbMessages.versionstampCipherKey.0
  currentVersionstampCipherKey: 0
  clusters:
    "messages-0":
      clusterFileUrl: ${SWARM_FDB_CLUSTER_FILE_URL:-file:///etc/foundationdb/fdb.cluster}
  epochs:
    0:
      - messages-0

# Four Redis clusters, one per role (see docker-compose.yml for why each is its own cluster).
cacheCluster:
  configurationUri: ${SWARM_REDIS_CACHE_URI:-redis://redis-cache:6379}
  timeout: PT3S

pushSchedulerCluster:
  configurationUri: ${SWARM_REDIS_PUSHSCHEDULER_URI:-redis://redis-pushscheduler:6379}
  timeout: PT3S

rateLimitersCluster:
  configurationUri: ${SWARM_REDIS_RATELIMITERS_URI:-redis://redis-ratelimiters:6379}
  timeout: PT3S

messageCache:
  persistDelayMinutes: 10
  cluster:
    configurationUri: ${SWARM_REDIS_MESSAGES_URI:-redis://redis-messages:6379}
    timeout: PT3S

# Standalone Redis: `pubsub` is a single-node client, not a cluster client.
pubsub:
  uri: ${SWARM_REDIS_PUBSUB_URI:-redis://redis-pubsub:6379}
  timeout: PT3S

# ---------------------------------------------------------------------------- object storage

# CDN / attachments, served by MinIO. The AWS SDK addresses S3 virtual-host style, so the
# compose network gives MinIO the alias swarm-cdn.minio.swarm.local and MinIO is started with
# MINIO_DOMAIN=minio.swarm.local so it accepts that form.
cdn:
  bucket: ${SWARM_CDN_BUCKET:-swarm-cdn}
  region: ${SWARM_AWS_REGION:-us-east-1}
  endpointOverride: ${SWARM_S3_ENDPOINT:-http://minio.swarm.local:9000}
  credentials:
    type: static
    accessKeyId: secret://cdn.accessKey
    secretAccessKey: secret://cdn.accessSecret

# Paged single-use post-quantum (KEM) prekeys. Written with the global AWS credentials.
pagedSingleUseKEMPreKeyStore:
  bucket: ${SWARM_PREKEY_BUCKET:-swarm-prekeys}
  region: ${SWARM_AWS_REGION:-us-east-1}
  endpointOverride: ${SWARM_S3_ENDPOINT:-http://minio.swarm.local:9000}

# Dynamic configuration. `DynamicConfigurationManager.getConfiguration()` blocks until the
# first successful read, so this object MUST exist: minio/bootstrap-buckets.sh uploads it.
# To change staging's dynamic config, upload a new version of the object; the server picks it
# up within refreshInterval.
dynamicConfig:
  s3Region: ${SWARM_AWS_REGION:-us-east-1}
  s3Bucket: ${SWARM_CONFIG_BUCKET:-swarm-config}
  objectKey: dynamic-config.yaml
  endpointOverride: ${SWARM_S3_ENDPOINT:-http://minio.swarm.local:9000}
  maxSize: 1000000
  refreshInterval: PT30S

# Autonomous-system table used for rate-limit bucketing. AsnInfoProviderImpl.fromTsvGz reads
# a GZIPPED 5-column TSV (start_ip, end_ip, AS_number, country_code, AS_description) in the
# iptoasn.com format. minio/bootstrap-buckets.sh gzips minio/asn.tsv and uploads it. Replace
# the object with the real iptoasn.com dump if ASN-based rate limiting ever matters.
asnTable:
  s3Region: ${SWARM_AWS_REGION:-us-east-1}
  s3Bucket: ${SWARM_CONFIG_BUCKET:-swarm-config}
  objectKey: asn.tsv.gz
  endpointOverride: ${SWARM_S3_ENDPOINT:-http://minio.swarm.local:9000}
  maxSize: 100000000
  refreshInterval: PT1H

# ---------------------------------------------------------------------------- registration

# The staging registration channel. `type: swarm-staging` is a SWARM addition that drops the
# Google Cloud identity token and nothing else; it refuses to build unless the environment
# variable SWARM_STAGING_FIXED_CODE is exactly "true". See docs/SWARM-CHANGES.md and
# registration-stub/README.md.
#
# registrationCaCertificate must be the PEM of the CA created by certs/make-certs.sh. It is
# passed as a single-line environment variable with \n escapes, because a YAML
# double-quoted scalar turns those back into newlines. `make-certs.sh` prints the value and
# generate-secrets.sh writes it into .env.
registrationService:
  type: swarm-staging
  host: ${SWARM_REGISTRATION_HOST:-registration-stub}
  port: ${SWARM_REGISTRATION_PORT:-8443}
  registrationCaCertificate: "${SWARM_REGISTRATION_CA_PEM}"
  collationKeySalt: secret://registrationService.collationKeySalt

# WebAuthn for registration. Origins must be the real public origin of the chat host.
registrationWebAuthn:
  relyingPartyId: ${SWARM_CHAT_DOMAIN:-chat.swarm.green}
  origins:
    - https://${SWARM_CHAT_DOMAIN:-chat.swarm.green}
  challengeTtl: PT2M
  userHandleBlindingSecret: secret://registrationWebAuthn.userHandleBlindingSecret

# Number lookup. Not used by the staging stub; the key is a placeholder.
hlrLookup:
  apiKey: secret://hlrLookup.apiKey
  apiSecret: secret://hlrLookup.apiSecret

shortCode:
  baseUrl: https://${SWARM_CHAT_DOMAIN:-chat.swarm.green}/shortcodes/

linkDevice:
  secret: secret://linkDevice.secret

idlePrimaryDeviceReminder:
  minIdleDuration: P30D

# ---------------------------------------------------------------------------- zk / sealed sender

# Generated for THIS deployment by generate-secrets.sh (the server's own `zkparams` and
# `certificate` commands). groupsZkConfig.serverPublic must be the public half of
# groupsZkConfig.serverSecret, and unidentifiedDelivery.certificate must be signed by the
# trust root the SWARM Messenger clients ship. See docs/STAGING.md.
callingZkConfigPreV101:
  serverSecret: secret://callingZkConfigPreV101.serverSecret

callingZkConfig:
  serverSecret: secret://callingZkConfigV101.serverSecret

chatZkConfig:
  serverSecret: secret://chatZkConfig.serverSecret

groupsZkConfig:
  serverPublic: ${SWARM_GROUPS_ZK_SERVER_PUBLIC}
  serverSecret: secret://groupsZkConfig.serverSecret

unidentifiedDelivery:
  certificate: ${SWARM_UNIDENTIFIED_DELIVERY_CERTIFICATE}
  privateKey: secret://unidentifiedDelivery.privateKey
  expiresDays: 7
  embedSigner: true

# ---------------------------------------------------------------------------- disabled: enclaves
# SVR2 / SVRB (PIN recovery) and CDSI (contact discovery) run in SGX enclaves that this stack
# does not have. The blocks below exist only because the configuration requires them. The
# hostnames do not resolve, the shared secrets are placeholders, and the certificates are the
# self-signed test certificates from upstream's test configuration. Effect for clients:
# no PIN-based recovery, no server-side contact discovery. See docs/STAGING.md.

directoryV2:
  client:
    userAuthenticationTokenSharedSecret: secret://directoryV2.client.userAuthenticationTokenSharedSecret
    userIdTokenSharedSecret: secret://directoryV2.client.userIdTokenSharedSecret

svr2:

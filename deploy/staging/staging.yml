svrb:
  uri: svrb.disabled.swarm.invalid
  userAuthenticationTokenSharedSecret: secret://svrb.userAuthenticationTokenSharedSecret
  userIdTokenSharedSecret: secret://svrb.userIdTokenSharedSecret
  svrCaCertificates:
    - *placeholderCertificate

storageService:
  uri: storage.disabled.swarm.invalid
  userAuthenticationTokenSharedSecret: secret://storageService.userAuthenticationTokenSharedSecret
  storageCaCertificates:
    - *placeholderCertificate

keyTransparencyService:
  host: kt.disabled.swarm.invalid
  port: 443
  tlsCertificate: *placeholderCertificate
  clientCertificate: *placeholderCertificate
  clientPrivateKey: secret://keyTransparencyService.clientPrivateKey

# ---------------------------------------------------------------------------- disabled: push
# No APNs certificate and no FCM project. Desktop clients receive messages over the
# websocket, which needs no push service. Mobile clients will not wake on new messages until
# real credentials are configured. The values below are upstream's test placeholders: they
# parse, so the server starts, and they cannot reach Apple or Google.

apn:
  sandbox: true
  bundleId: green.swarm.messenger.staging
  keyId: secret://apn.keyId
  teamId: secret://apn.teamId
  signingKey: secret://apn.signingKey

fcm:
  credentials: secret://fcm.credentials

# ---------------------------------------------------------------------------- disabled: GCP attachments
# Upstream signs CDN0/CDN2 upload URLs with a Google Cloud Storage service account. SWARM
# staging serves attachments from MinIO through the `cdn` block above; this block only has to
# parse. CDN0/CDN2 upload forms will not work.
gcpAttachments:
  domain: gcs.disabled.swarm.invalid
  email: disabled@gcs.disabled.swarm.invalid
  pathPrefix: ""
  rsaSigningKey: secret://gcpAttachments.rsaSigningKey

attachments:
  maxAttachmentUploadSizeInBytes: 104857600      # 100 MiB
  maxMessageBackupUploadSizeInBytes: 104857600

tus:
  uploadUri: https://${SWARM_CDN_DOMAIN:-cdn.chat.swarm.green}/upload
  userAuthenticationTokenSharedSecret: secret://tus.userAuthenticationTokenSharedSecret

cdn3StorageManager:
  baseUri: https://${SWARM_CDN_DOMAIN:-cdn.chat.swarm.green}
  clientId: swarm-staging
  clientSecret: secret://cdn3StorageManager.clientSecret
  sourceSchemes:
    2: gcs
    3: r2

# ---------------------------------------------------------------------------- disabled: calling
# No TURN/SFU server yet. `urls` and `urlsWithIps` are @NotEmpty in
# CloudflareTurnConfiguration, so they cannot be left empty; they name the planned
# sfu.chat.swarm.green host. Voice and video calling is non-functional until an SFU and TURN
# server exist there. No request is made to Cloudflare unless a client asks for credentials.
turn:
  cloudflare:
    apiToken: secret://turn.cloudflare.apiToken
    endpoint: https://turn.disabled.swarm.invalid/credentials/generate
    requestedCredentialTtl: PT24H
    clientCredentialTtl: PT12H
    urls:
      - turn:${SWARM_SFU_DOMAIN:-sfu.chat.swarm.green}:3478
    urlsWithIps:
      - turn:%s
      - turn:%s:3478?transport=tcp
    hostname: ${SWARM_SFU_DOMAIN:-sfu.chat.swarm.green}
    numHttpClients: 1

callQualitySurvey:
  pubSubPublisher: &disabled-pubsub
    project: swarm-staging-disabled
    topic: disabled
    credentialConfiguration: |
      {
        "type": "external_account",
        "credential_source": { "file": "/dev/null" },
        "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
        "audience": "//iam.googleapis.com/swarm-staging-disabled",
        "token_url": "https://sts.disabled.swarm.invalid/v1/token"
      }

# ---------------------------------------------------------------------------- disabled: payments
# MobileCoin payments are upstream's feature, not SWARM's. The SWARM wallet is on-device and
# does not use this. `externalClients` has no non-cloud implementation in the shaded jar, so
# the currency-conversion clients are configured with placeholder keys and will log failures
# if a client ever asks for exchange rates.
paymentsService:
  userAuthenticationTokenSharedSecret: secret://paymentsService.userAuthenticationTokenSharedSecret
  # @NotEmpty upstream, so it cannot be an empty list. MOB is upstream's own placeholder.
  paymentCurrencies:
    - MOB
  externalClients:
    fixerApiKey: secret://paymentsService.fixerApiKey
    coinGeckoApiKey: secret://paymentsService.coinGeckoApiKey
    # @NotEmpty upstream, so one entry is the minimum.
    coinGeckoCurrencyIds:
      MOB: mobilecoin

# ---------------------------------------------------------------------------- disabled: billing
# Stripe / Braintree / Google Play / App Store. No merchant account exists and none will for
# staging. Upstream constructs all four managers unconditionally at startup, so the blocks
# must parse; the credentials are upstream's test placeholders and cannot authenticate.
stripe:
  apiKey: secret://stripe.apiKey
  idempotencyKeyGenerator: secret://stripe.idempotencyKeyGenerator
  boostDescription: SWARM staging (disabled)
  # @NotEmpty map upstream; the currency sets may be empty, and are, because there are no
  # donation levels configured.
  supportedCurrenciesByPaymentMethod:
    CARD: []

braintree:
  merchantId: disabled
  publicKey: secret://braintree.publicKey
  privateKey: secret://braintree.privateKey
  environment: sandbox
  graphqlUrl: https://braintree.disabled.swarm.invalid/graphql
  merchantAccounts:
    'xts': disabled
  supportedCurrenciesByPaymentMethod:
    PAYPAL: []
  pubSubPublisher: *disabled-pubsub

googlePlayBilling:
  credentialsJson: |
    {
      "type": "external_account",
      "credential_source": { "file": "/dev/null" },
      "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
      "audience": "//iam.googleapis.com/swarm-staging-disabled",
      "token_url": "https://sts.disabled.swarm.invalid/v1/token"
    }
  packageName: green.swarm.messenger.staging
  applicationName: swarm-messenger-staging
  productIdToLevel: {}

appleAppStore:
  env: LOCAL_TESTING
  bundleId: green.swarm.messenger.staging
  appAppleId: 1
  issuerId: disabled
  keyId: disabled
  encodedKey: secret://appleAppStore.encodedKey
  subscriptionGroupId: disabled
  productIdToLevel: {}
  appleRootCerts:
    # Apple's published root CA certificate (https://www.apple.com/certificateauthority/),
    # the same one upstream's test configuration uses. AppleAppStoreClient builds a signature
    # verifier at startup and wants at least one parseable root; it is never used because no
    # App Store subscription exists.
    - 

appleDeviceCheck:
  production: false
  teamId: disabled
  bundleId: green.swarm.messenger.staging

deviceCheck:
  backupRedemptionDuration: P30D

subscription:
  badgeExpiration: P30D
  badgeGracePeriod: P15D
  backupExpiration: P30D
  backupGracePeriod: P15D
  backupFreeTierMediaDuration: P30D
  backupLevels: {}
  levels: {}

loginPurchase:
  playProductId: disabled
  playOptionId: disabled
  appStoreProductId: disabled

oneTimeDonations:
  sepaMaximumEuros: '0'
  boost:
    expiration: P90D
    badge: SWARM
  gift:
    expiration: P90D
    badge: SWARM
  currencies: {}

badges:
  badges:
    - id: SWARM
      category: other
      sprites:
        - sprite-1.png
        - sprite-2.png
        - sprite-3.png
        - sprite-4.png
        - sprite-5.png
        - sprite-6.png
      svg: swarm.svg
      svgs:
        - light: swarm-light.svg
          dark: swarm-dark.svg
  receiptLevels:
    ONE_TIME_DONATION: SWARM

# ---------------------------------------------------------------------------- misc

remoteConfig:
  globalConfig: {}

openTelemetry:
  enabled: false
  environment: swarm-staging
  shutdownWaitDuration: PT0S
  url: http://127.0.0.1:4318/
